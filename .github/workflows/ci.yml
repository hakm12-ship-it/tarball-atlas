name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Gate the CLI package with the local action
        uses: ./
        with:
          require: |
            bin/atlas.mjs
            offline/atlas.html
          forbid: |
            **/*.tgz
          max-unpacked: '500000'
      - name: Install and run the packed CLI outside the checkout
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          archive="$(npm pack --pack-destination "$work" --silent)"
          cd "$work"
          npm install --prefix "$work/tool" --no-audit --no-fund "$work/$archive"
          cli="$work/tool/node_modules/.bin/tarball-atlas"
          "$cli" scan "$GITHUB_WORKSPACE" --require offline/atlas.html
          "$cli" diff "$GITHUB_WORKSPACE/docs/examples/before.json" "$GITHUB_WORKSPACE/docs/examples/after.json" --html report.html
          test -s report.html
